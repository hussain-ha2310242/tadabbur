services:
  backend:
    build: ./backend
    environment:
      - FANAR_API_KEY=${FANAR_API_KEY:-}
      - FANAR_TTS_VOICE=${FANAR_TTS_VOICE:-Noor}
      - DATA_DIR=/data
      - CONTENT_DIR=/content
    volumes:
      - ./data:/data
      - ./content:/content:ro
      - ./backend/app:/srv/app # live-reload dev mount
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      - DOCKER=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
